<!-- Wazuh MANAGER receiving Hexward syslog directly (no agent on the product host).
     Add to /var/ossec/etc/ossec.conf (manager), restart the manager.
     Products: -syslog <manager-ip>:5514 -syslog-format json -syslog-network tcp
     Replace allowed-ips with the address(es) of your Hexward hosts. -->
<ossec_config>
  <remote>
    <connection>syslog</connection>
    <port>5514</port>
    <protocol>tcp</protocol>
    <allowed-ips>192.0.2.10</allowed-ips>
  </remote>
</ossec_config>
