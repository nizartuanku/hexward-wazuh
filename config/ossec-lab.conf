<!-- Lab configuration used to test hexward-wazuh end to end (Wazuh 4.14.9 manager).
     Appended to /var/ossec/etc/ossec.conf; Wazuh merges every <ossec_config> block. -->
<ossec_config>
  <!-- Path A: read Hexward NDJSON written next to the manager (agents use the same block) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/hexward/*.ndjson</location>
  </localfile>

  <!-- Path B: receive Hexward syslog over TCP from the lab network -->
  <remote>
    <connection>syslog</connection>
    <port>5514</port>
    <protocol>tcp</protocol>
    <allowed-ips>192.168.1.0/24</allowed-ips>
    <allowed-ips>172.16.0.0/12</allowed-ips>
  </remote>
</ossec_config>
