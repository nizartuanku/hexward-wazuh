<!-- Wazuh AGENT on the host that runs the Hexward product.
     Add to /var/ossec/etc/ossec.conf (agent), restart the agent.
     Products: -export-file /var/log/hexward/<product>.ndjson -->
<ossec_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/hexward/*.ndjson</location>
  </localfile>
</ossec_config>
